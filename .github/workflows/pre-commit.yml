name: Caspi cache inventory (read only)
on:
  workflow_dispatch:
permissions: {}
jobs:
  inventory:
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 20
    steps:
      - name: Verify runner and inspect cache filesystem
        shell: bash
        run: |
          set -uo pipefail
          export LC_ALL=C
          root=/data/actions/cache
          if [[ "${RUNNER_NAME:-}" != caspi || "$(hostname -s)" != caspi ]]; then
            printf 'Runner identity mismatch: runner=%s hostname=%s\n' "${RUNNER_NAME:-unset}" "$(hostname -s)"
            exit 1
          fi
          printf 'Runner identity verified: %s; job=%s; run=%s\n' "$RUNNER_NAME" "${GITHUB_JOB:-unset}" "${GITHUB_RUN_ID:-unset}"
          if [[ ! -d "$root" ]]; then
            printf 'MISSING_OR_INACCESSIBLE cache root: %s\n' "$root"
            exit 1
          fi
          canonical_root=$(timeout 10s realpath -e -- "$root") || { echo "root realpath failed or timed out"; exit 1; }
          printf 'Cache root resolved: %s\n' "$canonical_root"
          inventory_issue=0
          printf '\n## Filesystem usage\n'
          timeout 10s df -hPT -- "$root"; rc=$?; printf 'df_status=%s\n' "$rc"; ((rc == 0)) || inventory_issue=1
          timeout 10s df -PT -B1 -- "$root"; rc=$?; printf 'df_bytes_status=%s\n' "$rc"; ((rc == 0)) || inventory_issue=1
          printf '\n## Mount\n'
          if command -v findmnt >/dev/null 2>&1; then
            timeout 10s findmnt -T "$root" -o TARGET,SOURCE,FSTYPE; rc=$?; printf 'findmnt_status=%s\n' "$rc"; ((rc == 0)) || inventory_issue=1
          else
            printf 'findmnt unavailable; mount details missing\n'; inventory_issue=1
          fi
          reader=()
          if [[ "$(id -u)" == 0 ]]; then
            printf 'inspection_user=root\n'
          elif command -v sudo >/dev/null 2>&1 && sudo -n true 2>/dev/null; then
            reader=(sudo -n)
            printf 'inspection_user=noninteractive-sudo\n'
          else
            printf 'inspection_user=runner; inaccessible paths will be reported\n'
          fi
          printf '\n## Root and immediate child allocated sizes in bytes (same filesystem)\n'
          timeout 240s nice -n 19 "${reader[@]}" du -x -B1 -d 1 -- "$root"
          rc=$?; printf 'du_root_status=%s (124=timeout; nonzero may indicate permission errors)\n' "$rc"; ((rc == 0)) || inventory_issue=1
          printf '\n## Recognized cache paths, type and modification time; max depth 3\n'
          timeout 90s nice -n 19 "${reader[@]}" find -P "$root" -xdev -maxdepth 3 \
            \( \( -name .venv -o -name 'pre-commit-*' \) \( -type d -o -type l \) \
            -printf '%y %T@ %p -> %l\n' -prune \) -o \
            \( -name 'gr-*' \( -type d -o -type l \) -printf '%y %T@ %p -> %l\n' \)
          rc=$?; printf 'find_layout_status=%s (124=timeout; nonzero may indicate permission errors)\n' "$rc"; ((rc == 0)) || inventory_issue=1
          printf '\n## Venv allocated sizes in bytes (max 24 paths, same filesystem)\n'
          # Limit both time and breadth; only follow links resolving within the cache root.
          timeout 360s bash -c '
            set -uo pipefail
            root=$1; canonical=$2; shift 2
            prefix=("$@")
            "${prefix[@]}" find -P "$root" -xdev -maxdepth 3 \( -name "pre-commit-*" -type d -prune \) -o \( -name .venv \( -type d -o -type l \) -print0 -prune \) | {
              count=0
              incomplete=0
              while IFS= read -r -d "" path; do
                count=$((count + 1))
                if ((count > 24)); then echo "TRUNCATED: more than 24 .venv paths"; incomplete=1; break; fi
                resolved=$(timeout 10s "${prefix[@]}" realpath -e -- "$path" 2>/dev/null) || { printf "UNREADABLE_OR_BROKEN %s\n" "$path"; incomplete=1; continue; }
                case "$resolved" in
                  "$canonical"/*) ;;
                  *) printf "SKIP_OUTSIDE_CACHE %s -> %s\n" "$path" "$resolved"; incomplete=1; continue ;;
                esac
                printf "venv=%s resolved=%s\n" "$path" "$resolved"
                timeout 45s nice -n 19 "${prefix[@]}" du -s -B1 -x -- "$resolved"
                result=$?; printf "venv_du_status=%s\n" "$result"
                ((result == 0)) || incomplete=1
              done
              if ((count == 0)); then echo "NO_VENV_FOUND: size measurement incomplete"; incomplete=1; fi
              printf "venv_paths_examined=%s\n" "$count"
              exit "$incomplete"
            }
          ' bash "$root" "$canonical_root" "${reader[@]}"
          rc=$?; printf 'venv_inventory_status=%s (124=timeout; inspect permission errors above)\n' "$rc"; ((rc == 0)) || inventory_issue=1
          printf '\nRead-only inventory finished; partial sections are explicitly marked.\n'
          exit "$inventory_issue"
