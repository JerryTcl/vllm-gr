name: Isolated PR 598 CPU runtime comparison
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-runtime:
    name: CPU lane / ${{ matrix.install }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        install: [pypi-cuda-wheel, release-cpu-wheel]
    env:
      VLLM_GR_TARGET_DEVICE: cpu
      VLLM_GR_TEST_LANE: cpu
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Check out exact previously tested PR merge
        uses: actions/checkout@v4
        with:
          ref: 3cce14564e04282efa1abf527591868aa67de599
          persist-credentials: false
          fetch-depth: 2
      - name: Verify source and machine
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 3cce14564e04282efa1abf527591868aa67de599
          git log -1 --format='%H%n%P'
          git log -1 --format=%P | grep -Fq bab3873143078e48c11419609e1daf9afeb8af14
          uname -a
          ldd --version | head -1
          lscpu | grep -E 'Architecture|Model name|Flags' || true
          df -h /
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reclaim ephemeral runner toolchains for PyPI baseline
        if: matrix.install == 'pypi-cuda-wheel'
        shell: bash
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL || true
          df -h /
      - name: Install original PyPI baseline
        if: matrix.install == 'pypi-cuda-wheel'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir vllm==0.30.0
          python -m pip install --no-cache-dir pytest pytest-asyncio pytest-timeout pytest-xdist regex pandas
          python -m pip install --no-cache-dir -e . --no-deps
          python -m pip freeze > "$RUNNER_TEMP/cpu-packages.txt"
          df -h /
      - name: Install verified vLLM CPU wheel
        if: matrix.install == 'release-cpu-wheel'
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip uv
          wheel="vllm-0.30.0+cpu-cp38-abi3-manylinux_2_39_x86_64.whl"
          curl --fail --location --retry 3 --output "$RUNNER_TEMP/$wheel" "https://github.com/vllm-project/vllm/releases/download/v0.30.0/$wheel"
          echo "0ee75278b3626c5d0b7c310c6d62afae93e900f4eac339c91e333fde5108ed78  $RUNNER_TEMP/$wheel" | sha256sum -c -
          python -m uv pip install --system --torch-backend cpu "$RUNNER_TEMP/$wheel" pytest pytest-asyncio pytest-timeout pytest-xdist regex pandas scikit-learn intel-openmp
          python -m uv pip install --system --no-deps -e .
          python -m pip freeze > "$RUNNER_TEMP/cpu-packages.txt"
          df -h /
      - name: Configure Intel OpenMP for CPU wheel
        if: matrix.install == 'release-cpu-wheel'
        shell: bash
        run: |
          set -euo pipefail
          iomp="$(python -c 'import glob, os, sys; p=glob.glob(os.path.join(sys.prefix,"lib","**","libiomp5.so"),recursive=True); print(p[0] if p else "")')"
          test -n "$iomp" && test -f "$iomp"
          printf 'LD_PRELOAD=%s\n' "$iomp" >> "$GITHUB_ENV"
      - name: Verify CPU wheel and no CUDA
        if: matrix.install == 'release-cpu-wheel'
        shell: bash
        run: |
          python - <<'PY'
          import importlib.metadata as m
          import torch
          import sklearn
          import vllm
          from vllm.platforms import current_platform
          print("vllm", m.version("vllm"), "torch", torch.__version__, "sklearn", sklearn.__version__)
          print("platform", type(current_platform).__name__, "device_type", current_platform.device_type)
          print("cuda_available", torch.cuda.is_available(), "cuda_runtime", torch.version.cuda)
          assert "+cpu" in m.version("vllm")
          assert current_platform.device_type == "cpu"
          assert not torch.cuda.is_available() and torch.version.cuda is None
          PY
      - name: Run original CPU lane and retain JUnit
        shell: bash
        run: |
          set -o pipefail
          /usr/bin/time -v python -m pytest tests -m "not requires_gpu" --run-slow -n auto --durations=10 -q -rs --timeout=250 --junitxml="$RUNNER_TEMP/cpu-junit.xml" 2>&1 | tee "$RUNNER_TEMP/cpu-pytest.log"
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr598-cpu-audit-${{ matrix.install }}
          path: |
            ${{ runner.temp }}/cpu-junit.xml
            ${{ runner.temp }}/cpu-pytest.log
            ${{ runner.temp }}/cpu-packages.txt
          if-no-files-found: warn



