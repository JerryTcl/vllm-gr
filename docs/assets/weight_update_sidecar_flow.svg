<svg xmlns="http://www.w3.org/2000/svg" width="1640" height="1280" viewBox="0 0 1640 1280" role="img" aria-labelledby="title desc">
<title id="title">Weight update sidecar flow</title>
<desc id="desc">Steps 1, 2 and 3 share the same vertical centerline. Storage implementations are on the right. All original branches and instance lifecycles are retained.</desc>
<rect width="100%" height="100%" fill="white"/>
