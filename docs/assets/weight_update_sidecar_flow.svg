<text x="230" y="548.5" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#243447">Group succeeded;</text>
<text x="230" y="571.5" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#243447">instances remain</text>
<polyline points="1020,965 1300,965 1300,1045" fill="none" stroke="#7a8999" stroke-width="1.7"/>
<polygon points="1300,1045 1295.6503446588877,1035.9955289764732 1304.3496553411123,1035.9955289764732" fill="#7a8999"/>
<rect x="1116.5" y="931.0" width="147" height="20" fill="white"/>
<text x="1190" y="941.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="14" fill="#243447">Any instance failed</text>
<rect x="650.0" y="50.0" width="340" height="100" rx="12" fill="#edf5ff" stroke="#3572b0" stroke-width="1.5"/>
<text x="820" y="100.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#243447">1. Check model update</text>
<rect x="620.0" y="260.0" width="400" height="100" rx="12" fill="#edf5ff" stroke="#3572b0" stroke-width="1.5"/>
<text x="820" y="298.5" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#243447">2. Check model valid</text>
<text x="820" y="321.5" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#243447">Download, validate and publish locally</text>
<rect x="620.0" y="480.0" width="400" height="110" rx="12" fill="#edf5ff" stroke="#3572b0" stroke-width="1.5"/>
<text x="820" y="512.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#243447">3. Rolling update</text>
<text x="820" y="535.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#243447">N service instances; at most n updating</text>
<text x="820" y="558.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#243447">n configurable, default 1</text>
<rect x="665.0" y="735.0" width="310" height="80" rx="12" fill="#edf5ff" stroke="#3572b0" stroke-width="1.5"/>
<text x="820" y="763.5" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#243447">... independent instance lifecycles</text>
<text x="820" y="786.5" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#243447">...</text>
<rect x="300.0" y="735.0" width="320" height="80" rx="12" fill="#ffffff" stroke="#9eafbf" stroke-width="1.5"/>
<text x="460" y="763.5" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#243447">Instance i:</text>
<text x="460" y="786.5" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#243447">pause / reload / resume / warmup</text>
<rect x="1020.0" y="735.0" width="320" height="80" rx="12" fill="#ffffff" stroke="#9eafbf" stroke-width="1.5"/>
<text x="1180" y="763.5" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#243447">Instance j:</text>
<text x="1180" y="786.5" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="15" fill="#243447">pause / reload / resume / warmup</text>
<rect x="620.0" y="930.0" width="400" height="70" rx="12" fill="#edf5ff" stroke="#3572b0" stroke-width="1.5"/>
<text x="820" y="965.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#243447">Wait for this group to finish</text>
<rect x="650.0" y="1160.0" width="340" height="80" rx="12" fill="#edf5ff" stroke="#3572b0" stroke-width="1.5"/>
<text x="820" y="1200.0" text-anchor="middle" dominant-baseline="middle" font-family="DejaVu Sans, sans-serif" font-size="17" fill="#243447">Rollout complete</text>
<rect x="1120.0" y="170.0" width="190" height="70" rx="12" fill="#ffffff" stroke="#9eafbf" stroke-width="1.5"/>
